version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: manga_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: 22042003
      MYSQL_DATABASE: manga_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo
    container_name: manga_mongo
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: